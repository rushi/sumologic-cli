[project]
name = "sumologic-cli"
version = "0.1.0"
description = "SumoLogic MCP server as a standalone CLI"
requires-python = ">=3.11"
dependencies = ["mcp2cli==3.6.0"]

[project.scripts]
sumologic = "sumologic_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sumologic_cli"]

[dependency-groups]
dev = ["pyinstaller>=6.11"]
